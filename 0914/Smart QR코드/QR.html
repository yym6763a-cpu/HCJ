<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR - 스마트한 QR 코드 생성기</title>
    <!-- QR 코드 생성 라이브러리 (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-color: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* 마우스 움직임에 반응하는 화사한 파스텔 동적 그라데이션 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-main);
            background: 
                radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(254, 215, 170, 0.7) 0%, rgba(224, 231, 255, 0.6) 35%, rgba(250, 232, 255, 0.5) 70%, rgba(255, 255, 255, 0.9) 100%),
                linear-gradient(120deg, #f0f9ff 0%, #faf5ff 100%);
            background-attachment: fixed;
            transition: background 0.1s ease-out;
        }

        /* 1 & 2. 상단 헤더 (글래스모피즘 스타일) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            height: 38px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo:hover {
            transform: scale(1.03);
        }

        .site-name {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* 메인 컨테이너 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            max-width: 580px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .hero-title h1 {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .hero-title p {
            font-size: 1.05rem;
            color: var(--text-sub);
        }

        /* 4. QR 코드 영역 */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            opacity: 0;
            max-height: 0;
            transform: translateY(-15px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            overflow: hidden;
            margin-bottom: 0;
        }

        .qr-section.active {
            opacity: 1;
            max-height: 500px;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            margin-bottom: 28px;
        }

        .qr-card-wrapper {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .qr-card-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(99, 102, 241, 0.15);
        }

        /* 5. QR 코드 다운로드 버튼 역할 */
        #qrcode {
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            padding: 12px;
            background: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
            line-height: 0;
        }

        .download-badge {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: rgba(238, 242, 255, 0.8);
            color: #4f46e5;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .qr-card-wrapper:hover .download-badge {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        /* 3. 중앙 URL 입력창 영역 */
        .input-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            display: flex;
            gap: 8px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-card:focus-within {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12), 0 15px 35px rgba(0, 0, 0, 0.04);
        }

        .input-card input {
            flex: 1;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
        }

        .input-card input::placeholder {
            color: #94a3b8;
        }

        .input-card button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: var(--primary-gradient);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            white-space: nowrap;
        }

        .input-card button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.4);
        }

        .input-card button:active {
            transform: translateY(0);
        }

        /* 반응형 설정 */
        @media (max-width: 480px) {
            header {
                padding: 15px 20px;
            }
            .hero-title h1 {
                font-size: 1.7rem;
            }
            .input-card {
                flex-direction: column;
                padding: 10px;
            }
            .input-card button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <div class="site-name">Smart QR</div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <div class="hero-title">
            <h1>QR 코드로 쉽고 빠르게 연결하세요</h1>
            <p>웹사이트 주소를 입력하면 즉시 QR 코드가 생성됩니다.</p>
        </div>

        <!-- 4 & 5. QR 코드 생성 및 다운로드 영역 -->
        <div class="qr-section" id="qr-section">
            <div class="qr-card-wrapper">
                <div id="qrcode" title="클릭하면 JPG로 다운로드됩니다"></div>
                <div class="download-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    클릭하여 JPG 다운로드
                </div>
            </div>
        </div>

        <!-- 3. 심플하고 세련된 URL 입력창 -->
        <div class="input-card">
            <input type="text" id="url-input" placeholder="https://example.com" autocomplete="off">
            <button id="generate-btn">QR 생성</button>
        </div>
    </main>

    <script>
        // ★ 마우스 위치 추적 인터랙티브 그라데이션 스크립트 ★
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        });

        const urlInput = document.getElementById('url-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrSection = document.getElementById('qr-section');
        const qrContainer = document.getElementById('qrcode');

        generateBtn.addEventListener('click', generateQRCode);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateQRCode();
        });

        function generateQRCode() {
            let url = urlInput.value.trim();

            if (!url) {
                alert('URL을 입력해 주세요.');
                urlInput.focus();
                return;
            }

            // http:// 또는 https:// 가 없으면 자동 추가
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                urlInput.value = url;
            }

            // 기존 QR코드 초기화
            qrContainer.innerHTML = '';

            // QR코드 생성
            new QRCode(qrContainer, {
                text: url,
                width: 220,
                height: 220,
                colorDark: "#1e293b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // 화면 등장 효과
            qrSection.classList.add('active');
        }

        // QR코드 클릭 시 JPG 파일로 다운로드
        qrContainer.addEventListener('click', () => {
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');

            if (!img && !canvas) return;

            const downloadCanvas = document.createElement('canvas');
            const ctx = downloadCanvas.getContext('2d');
            
            const width = img ? img.naturalWidth : canvas.width;
            const height = img ? img.naturalHeight : canvas.height;

            const margin = 24;
            downloadCanvas.width = width + (margin * 2);
            downloadCanvas.height = height + (margin * 2);

            // 흰색 배경 채우기
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, downloadCanvas.width, downloadCanvas.height);

            // QR 코드 그리기
            if (img) {
                ctx.drawImage(img, margin, margin);
            } else {
                ctx.drawImage(canvas, margin, margin);
            }

            // JPG 다운로드
            const imageURI = downloadCanvas.toDataURL('image/jpeg', 1.0);
            const link = document.createElement('a');
            link.href = imageURI;
            link.download = 'Smart_QR.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
