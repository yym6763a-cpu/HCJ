<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라스트 마블 당첨자 추첨기 🔮</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #8b5cf6;
            --accent-glow: #a855f7;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 왼쪽 컨트롤 패널 */
        .controls {
            flex: 1;
            min-width: 280px;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn-start:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .rule-box {
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid var(--accent-glow);
            padding: 10px 14px;
            border-radius: 4px 8px 8px 4px;
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        /* 중앙 게임 캔버스 */
        .game-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: #020617;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* 오른쪽 순위 패널 */
        .status-panel {
            flex: 1;
            min-width: 260px;
            max-width: 300px;
            display: flex;
            flex-direction: column;
        }

        .status-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rank-list {
            list-style: none;
            overflow-y: auto;
            max-height: 480px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .rank-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        .rank-item.winner {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(249, 115, 22, 0.2));
            border: 1px solid rgba(234, 179, 8, 0.5);
            font-weight: bold;
            color: #fde047;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 모달 (당첨자 발표) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 2px solid var(--accent-glow);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.4);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px;
            width: 90%;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h2 {
            color: #93c5fd;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .modal-card .winner-name {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fde047;
            margin: 16px 0;
            text-shadow: 0 0 15px rgba(253, 224, 71, 0.5);
        }

        .modal-btn {
            background: var(--accent-color);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔮 라스트 마블 추첨기</h1>
        <p>장애물을 지나 <strong>가장 마지막에 도착하는 구슬</strong>이 최종 당첨자입니다!</p>
    </header>

    <div class="container">
        <!-- 설정 패널 -->
        <div class="panel controls">
            <div>
                <label for="nameInput">참가자 이름 (줄바꿈 또는 쉼표 구분)</label>
                <textarea id="nameInput" placeholder="김철수&#10;이영희&#10;박민수&#10;최지우&#10;정우성&#10;한지민"></textarea>
            </div>
            <div class="btn-group">
                <button id="startBtn" class="btn-start">추첨 시작!</button>
            </div>
            <div class="rule-box">
                💡 <strong>규칙:</strong> 모든 구슬이 낙하합니다. 먼저 통과한 구슬은 탈락하며, 끝까지 살아남아 가장 늦게 바닥에 닿는 사람이 승리합니다!
            </div>
        </div>

        <!-- 게임 화면 -->
        <div class="panel game-area">
            <canvas id="gameCanvas" width="440" height="580"></canvas>
        </div>

        <!-- 결과 패널 -->
        <div class="panel status-panel">
            <h3>통과 순서 <span id="marbleCount" style="font-size: 0.85rem; color: var(--accent-glow);">0명 남음</span></h3>
            <ul id="rankList" class="rank-list">
                <!-- 도착한 사람들이 순서대로 표시됩니다 -->
            </ul>
        </div>
    </div>

    <!-- 당첨자 모달 -->
    <div id="winnerModal" class="modal-overlay">
        <div class="modal-card">
            <h2>🎉 최후의 승리자 🎉</h2>
            <div id="winnerName" class="winner-name">홍길동</div>
            <p style="color: #cbd5e1; font-size: 0.95rem;">마지막까지 버티고 당첨되었습니다!</p>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const startBtn = document.getElementById('startBtn');
        const rankList = document.getElementById('rankList');
        const marbleCountLabel = document.getElementById('marbleCount');
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameDiv = document.getElementById('winnerName');

        // 기본 참가자 세팅
        nameInput.value = "김철수\n이영희\n박민수\n최지우\n정우성\n한지민\n윤서준\n강다은";

        // 물리 상수 및 물리 객체 변수
        const GRAVITY = 0.15;
        const RESTITUTION = 0.55; // 반발 계수
        const MARBLE_RADIUS = 13;
        const PEG_RADIUS = 5;

        let marbles = [];
        let pegs = [];
        let finishedMarbles = [];
        let isRunning = false;
        let animationFrameId = null;

        // 장애물(Pegs) 배치 생성
        function createPegs() {
            pegs = [];
            const rows = 9;
            const startY = 100;
            const rowSpacing = 48;
            
            for (let r = 0; r < rows; r++) {
                const cols = (r % 2 === 0) ? 7 : 8;
                const spacing = canvas.width / (cols + 1);
                
                for (let c = 0; c < cols; c++) {
                    const x = spacing * (c + 1);
                    const y = startY + r * rowSpacing;
                    pegs.push({ x, y, radius: PEG_RADIUS });
                }
            }
        }

        // 구슬 색상 무지개 톤 생성
        function getMarbleColor(index, total) {
            const hue = (index * (360 / Math.max(total, 1))) % 360;
            return `hsl(${hue}, 85%, 60%)`;
        }

        class Marble {
            constructor(name, x, y, color) {
                this.name = name;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2;
                this.radius = MARBLE_RADIUS;
                this.color = color;
                this.finished = false;
            }

            update() {
                if (this.finished) return;

                // 중력 적용
                this.vy += GRAVITY;

                // 위치 업데이트
                this.x += this.vx;
                this.y += this.vy;

                // 벽면 충돌 (좌/우)
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -RESTITUTION;
                } else if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -RESTITUTION;
                }

                // 장애물 충돌 처리
                pegs.forEach(peg => {
                    const dx = this.x - peg.x;
                    const dy = this.y - peg.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = this.radius + peg.radius;

                    if (dist < minDist) {
                        // 위치 밀어내기 (겹침 방지)
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        this.x += nx * overlap;
                        this.y += ny * overlap;

                        // 반사 속도 계산
                        const dot = this.vx * nx + this.vy * ny;
                        this.vx = (this.vx - 2 * dot * nx) * RESTITUTION + (Math.random() - 0.5) * 0.5;
                        this.vy = (this.vy - 2 * dot * ny) * RESTITUTION;
                    }
                });

                // 도착 지점 판정 (바닥 도착)
                if (this.y + this.radius >= canvas.height - 30) {
                    this.finished = true;
                    this.y = canvas.height - 30;
                    this.vx = 0;
                    this.vy = 0;
                    onMarbleFinish(this);
                }
            }

            draw() {
                ctx.save();
                
                // 구슬 입체감/글로우 효과
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();

                // 구슬 하이라이트
                ctx.beginPath();
                ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();
                ctx.closePath();

                ctx.restore();

                // 이름 텍스트 표시
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(this.name.substring(0, 4), this.x, this.y - this.radius - 5);
                ctx.shadowBlur = 0;
            }
        }

        // 장애물 그리기
        function drawPegs() {
            pegs.forEach(peg => {
                ctx.save();
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.closePath();
                ctx.restore();
            });
        }

        // 바닥 도착선 그리기
        function drawFinishLine() {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
            ctx.setLineDash([8, 6]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 30);
            ctx.lineTo(canvas.width, canvas.height - 30);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 게임 시작 logic
        function startGame() {
            const names = nameInput.value.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
            
            if (names.length < 2) {
                alert('최소 2명 이상의 이름을 입력해주세요!');
                return;
            }

            // 초기화
            marbles = [];
            finishedMarbles = [];
            rankList.innerHTML = '';
            isRunning = true;
            startBtn.disabled = true;

            updateRemainingCount(names.length);

            // 구슬 생성 (상단 중앙 부근에서 약간의 시차/위치 차이로 생성)
            names.forEach((name, index) => {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = -index * 35; // 구슬끼리 약간 차례대로 내려오도록
                const color = getMarbleColor(index, names.length);
                marbles.push(new Marble(name, canvas.width / 2 + offsetX, offsetY, color));
            });

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animate();
        }

        // 구슬이 통과할 때마다 호출
        function onMarbleFinish(marble) {
            finishedMarbles.push(marble);
            
            const remaining = marbles.length - finishedMarbles.length;
            updateRemainingCount(remaining);

            // 리더보드 항목 추가
            const li = document.createElement('li');
            li.className = 'rank-item';
            
            const isLast = finishedMarbles.length === marbles.length;
            
            if (isLast) {
                li.classList.add('winner');
                li.innerHTML = `<span>👑 [당첨!] ${marble.name}</span> <span>최후 통과</span>`;
            } else {
                li.innerHTML = `<span>${finishedMarbles.length}등 (탈락): ${marble.name}</span>`;
            }

            rankList.appendChild(li);
            rankList.scrollTop = rankList.scrollHeight;

            // 모든 구슬이 떨어졌을 때 처리
            if (isLast) {
                isRunning = false;
                startBtn.disabled = false;
                setTimeout(() => {
                    showWinner(marble.name);
                }, 600);
            }
        }

        function updateRemainingCount(count) {
            marbleCountLabel.innerText = `${count}명 남아있음`;
        }

        function showWinner(name) {
            winnerNameDiv.innerText = name;
            winnerModal.classList.add('active');
        }

        function closeModal() {
            winnerModal.classList.remove('active');
        }

        // 애니메이션 루프
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawFinishLine();
            drawPegs();

            marbles.forEach(marble => {
                marble.update();
                marble.draw();
            });

            if (isRunning || marbles.some(m => !m.finished)) {
                animationFrameId = requestAnimationFrame(animate);
            }
        }

        // 초기화 시 장애물 설치 및 최초 렌더링
        createPegs();
        drawPegs();
        drawFinishLine();

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
