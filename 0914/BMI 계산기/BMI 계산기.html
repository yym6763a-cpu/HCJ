<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 BMI & 체중 관리 계산기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 flex items-center justify-center">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-white text-center">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        <i class="fa-solid me-1 fa-weight-scale"></i> 스마트 BMI 계산기
      </h1>
      <p class="text-indigo-100 text-sm mt-1">나의 체질량지수와 목표 체중을 확인해보세요</p>
    </div>

    <!-- Input Form -->
    <form id="bmiForm" class="p-6 space-y-5">
      <!-- Gender Selection -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">성별</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="gender" value="male" checked class="peer hidden">
            <div class="border-2 border-slate-200 rounded-xl p-3 text-center transition-all peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 text-slate-500 font-medium hover:bg-slate-50">
              <i class="fa-solid fa-mars text-lg mb-1 block"></i> 남성
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="gender" value="female" class="peer hidden">
            <div class="border-2 border-slate-200 rounded-xl p-3 text-center transition-all peer-checked:border-purple-500 peer-checked:bg-purple-50 peer-checked:text-purple-600 text-slate-500 font-medium hover:bg-slate-50">
              <i class="fa-solid fa-venus text-lg mb-1 block"></i> 여성
            </div>
          </label>
        </div>
      </div>

      <!-- Height & Weight Inputs -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="height" class="block text-sm font-semibold text-slate-700 mb-1">키 (cm)</label>
          <div class="relative">
            <input type="number" id="height" required placeholder="170" step="0.1" min="50" max="250"
                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-800 font-medium">
            <span class="absolute right-3 top-2.5 text-slate-400 text-sm">cm</span>
          </div>
        </div>
        <div>
          <label for="weight" class="block text-sm font-semibold text-slate-700 mb-1">몸무게 (kg)</label>
          <div class="relative">
            <input type="number" id="weight" required placeholder="65" step="0.1" min="20" max="300"
                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-800 font-medium">
            <span class="absolute right-3 top-2.5 text-slate-400 text-sm">kg</span>
          </div>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition-all transform active:scale-[0.98]">
        BMI 계산하기
      </button>
    </form>

    <!-- Result Area -->
    <div id="resultCard" class="hidden border-t border-slate-100 bg-slate-50/50 p-6 space-y-6">
      
      <!-- Main BMI Display -->
      <div class="text-center bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">나의 BMI 결과</span>
        <div id="bmiValue" class="text-4xl font-extrabold text-slate-800 my-1">--.--</div>
        <div id="bmiStatus" class="inline-block px-3 py-1 rounded-full text-xs font-bold text-white bg-slate-400 mt-1">
          상태 미측정
        </div>

        <!-- BMI Gauge Bar -->
        <div class="mt-4">
          <div class="h-2.5 w-full bg-slate-200 rounded-full overflow-hidden flex">
            <div class="w-[28%] bg-blue-400" title="저체중 (<18.5)"></div>
            <div class="w-[28%] bg-emerald-400" title="정상 (18.5~22.9)"></div>
            <div class="w-[14%] bg-amber-400" title="과체중 (23.0~24.9)"></div>
            <div class="w-[30%] bg-rose-500" title="비만 (≥25.0)"></div>
          </div>
          <div class="flex justify-between text-[10px] text-slate-400 mt-1 font-medium px-0.5">
            <span>저체중</span>
            <span>정상</span>
            <span>과체중</span>
            <span>비만</span>
          </div>
        </div>
      </div>

      <!-- Target Weights Comparison (90%, 100%, 110%) -->
      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-indigo-500"></i> 표준 체중 대비 목표 체중 분석
        </h3>

        <div class="space-y-2.5">
          <!-- 90% Target -->
          <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-sky-400"></span>
                <span class="text-sm font-semibold text-slate-700">표준의 90% (슬림)</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">목표 체중: <span id="target90Weight" class="font-medium text-slate-600">--</span> kg</p>
            </div>
            <div id="diff90" class="text-right text-sm font-bold">--</div>
          </div>

          <!-- 100% Target -->
          <div class="bg-white p-3.5 rounded-xl border-2 border-indigo-100 shadow-sm flex justify-between items-center relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>
            <div class="pl-1">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                <span class="text-sm font-bold text-indigo-900">표준의 100% (이상적)</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">목표 체중: <span id="target100Weight" class="font-medium text-slate-600">--</span> kg</p>
            </div>
            <div id="diff100" class="text-right text-sm font-bold">--</div>
          </div>

          <!-- 110% Target -->
          <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                <span class="text-sm font-semibold text-slate-700">표준의 110% (통통)</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">목표 체중: <span id="target110Weight" class="font-medium text-slate-600">--</span> kg</p>
            </div>
            <div id="diff110" class="text-right text-sm font-bold">--</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('bmiForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const gender = document.querySelector('input[name="gender"]:checked').value;
      const heightCm = parseFloat(document.getElementById('height').value);
      const weightKg = parseFloat(document.getElementById('weight').value);

      if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) return;

      const heightM = heightCm / 100;
      
      // 1. BMI 계산
      const bmi = weightKg / (heightM * heightM);

      // 2. 표준 체중(100%) 계산 (대한비만학회/한국 보건복지부 기준)
      // 남성: 키(m)^2 * 22, 여성: 키(m)^2 * 21
      const stdBmiFactor = gender === 'male' ? 22 : 21;
      const stdWeight100 = (heightM * heightM) * stdBmiFactor;
      const stdWeight90 = stdWeight100 * 0.9;
      const stdWeight110 = stdWeight100 * 1.1;

      // 3. UI - BMI 및 상태 표시
      const bmiValueEl = document.getElementById('bmiValue');
      const bmiStatusEl = document.getElementById('bmiStatus');

      bmiValueEl.textContent = bmi.toFixed(1);

      let statusText = '';
      let statusClass = '';

      // 한국 대한비만학회 기준 BMI 분류
      if (bmi < 18.5) {
        statusText = '저체중';
        statusClass = 'bg-blue-500';
      } else if (bmi < 23.0) {
        statusText = '정상 체중';
        statusClass = 'bg-emerald-500';
      } else if (bmi < 25.0) {
        statusText = '비만 전단계 (과체중)';
        statusClass = 'bg-amber-500';
      } else if (bmi < 30.0) {
        statusText = '1단계 비만';
        statusClass = 'bg-rose-500';
      } else if (bmi < 35.0) {
        statusText = '2단계 비만';
        statusClass = 'bg-rose-600';
      } else {
        statusText = '3단계 비만 (고도비만)';
        statusClass = 'bg-rose-800';
      }

      bmiStatusEl.textContent = statusText;
      bmiStatusEl.className = `inline-block px-3 py-1 rounded-full text-xs font-bold text-white mt-1 ${statusClass}`;

      // 4. 차이(감량/증량) 계산 및 렌더링 함수
      function formatDiff(targetWeight, currentWeight) {
        const diff = targetWeight - currentWeight;
        const absDiff = Math.abs(diff).toFixed(1);

        if (Math.abs(diff) < 0.05) {
          return `<span class="text-emerald-600"><i class="fa-solid fa-check text-xs me-1"></i>현재 도달</span>`;
        } else if (diff < 0) {
          // 감량 필요 (현재 체중이 목표보다 큼)
          return `<span class="text-rose-500"><i class="fa-solid fa-caret-down text-xs me-1"></i>${absDiff} kg 감량</span>`;
        } else {
          // 증량 필요 (현재 체중이 목표보다 작음)
          return `<span class="text-blue-500"><i class="fa-solid fa-caret-up text-xs me-1"></i>${absDiff} kg 증량</span>`;
        }
      }

      // 5. 각 목표 체중 및 차이 업데이트
      document.getElementById('target90Weight').textContent = stdWeight90.toFixed(1);
      document.getElementById('target100Weight').textContent = stdWeight100.toFixed(1);
      document.getElementById('target110Weight').textContent = stdWeight110.toFixed(1);

      document.getElementById('diff90').innerHTML = formatDiff(stdWeight90, weightKg);
      document.getElementById('diff100').innerHTML = formatDiff(stdWeight100, weightKg);
      document.getElementById('diff110').innerHTML = formatDiff(stdWeight110, weightKg);

      // 결과 영역 표시
      document.getElementById('resultCard').classList.remove('hidden');
    });
  </script>
</body>
</html>
