<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Image Resizer</title>
    <!-- JSZip 라이브러리 (일괄 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eeefff;
            --success: #10b981;
            --success-hover: #059669;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1 & 2. Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container a {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .logo-container a:hover {
            opacity: 0.8;
        }

        .logo-container img {
            height: 36px;
            object-fit: contain;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        /* Main Container */
        main {
            max-width: 960px;
            width: 100%;
            margin: 40px auto;
            padding: 0 24px;
            flex: 1;
        }

        .section-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 28px;
            margin-bottom: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* 3. Drag and Drop Area */
        .upload-box {
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            border-radius: var(--radius-md);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .upload-box:hover, .upload-box.dragover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            color: var(--primary);
            margin-bottom: 4px;
        }

        .upload-text-main {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .upload-text-sub {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .btn-upload {
            background-color: var(--primary);
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.2);
            transition: all 0.2s;
        }

        .btn-upload:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(99, 102, 241, 0.3);
        }

        /* Options Panel */
        .option-group {
            margin-bottom: 24px;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 4. Aspect Ratio Controls */
        .ratio-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .ratio-btn {
            padding: 10px 18px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .ratio-btn:hover {
            border-color: #a5b4fc;
            background-color: #fafafa;
        }

        .ratio-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.25);
        }

        .custom-ratio-inputs {
            display: none;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
        }

        .custom-ratio-inputs.active {
            display: flex;
        }

        .custom-ratio-inputs input {
            width: 54px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }

        .custom-ratio-inputs input:focus {
            border-color: var(--primary);
        }

        /* 5, 6, 7. Mode & Color Selection */
        .mode-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .segmented-control {
            display: inline-flex;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-sm);
            gap: 4px;
        }

        .segmented-control label {
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .segmented-control input[type="radio"] {
            display: none;
        }

        .segmented-control label:has(input:checked) {
            background-color: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .color-picker-wrapper.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .color-picker-wrapper label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }

        /* Action & Download All Button */
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .controls-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 11. Download All Button */
        .btn-download-all {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
            transition: all 0.2s;
        }

        .btn-download-all:hover:not(:disabled) {
            background-color: var(--success-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
        }

        .btn-download-all:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 8, 9, 10. File List & Progress */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            background: white;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s;
        }

        .file-item:hover {
            border-color: #cbd5e1;
        }

        .thumbnail {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: #f1f5f9;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, #818cf8 100%);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .btn-download {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-download:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .btn-download:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 1 & 2. 상단 헤더 -->
    <header>
        <div class="logo-container">
            <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer">
                <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/120x36/6366f1/ffffff?text=NANA+LAB'">
            </a>
        </div>
        <div class="header-title">Smart Image Resizer</div>
    </header>

    <main>
        <!-- 3. 이미지 업로드 드래그 앤 드롭 영역 -->
        <div class="section-card">
            <div class="upload-box" id="dropZone">
                <div class="upload-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <div class="upload-text-main">사진을 드래그 앤 드롭하거나 아래 버튼을 누르세요</div>
                <div class="upload-text-sub">JPG, PNG, WEBP 등의 이미지 파일 선택 (다중 선택 가능)</div>
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">사진 파일 선택</button>
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            </div>
        </div>

        <!-- 옵션 설정 메뉴 -->
        <div class="section-card">
            <!-- 4. 캔버스 비율 선택 -->
            <div class="option-group">
                <div class="option-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    캔버스 비율 선택
                </div>
                <div class="ratio-buttons">
                    <button class="ratio-btn active" data-ratio="1:1">1:1</button>
                    <button class="ratio-btn" data-ratio="3:4">3:4</button>
                    <button class="ratio-btn" data-ratio="4:3">4:3</button>
                    <button class="ratio-btn" data-ratio="9:16">9:16</button>
                    <button class="ratio-btn" data-ratio="16:9">16:9</button>
                    <button class="ratio-btn" data-ratio="custom">커스텀</button>

                    <div class="custom-ratio-inputs" id="customRatioContainer">
                        <input type="number" id="customW" placeholder="가로" value="1" min="1">
                        <span>:</span>
                        <input type="number" id="customH" placeholder="세로" value="1" min="1">
                    </div>
                </div>
            </div>

            <!-- 5, 6, 7. Padding / Crop 및 여백 색상 선택 -->
            <div class="option-group">
                <div class="option-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
                    변환 방식
                </div>
                <div class="mode-selection">
                    <div class="segmented-control">
                        <label>
                            <input type="radio" name="resizeMode" value="padding" checked>
                            Padding (여백 추가)
                        </label>
                        <label>
                            <input type="radio" name="resizeMode" value="crop">
                            Crop (자르기)
                        </label>
                    </div>

                    <div class="color-picker-wrapper" id="colorPickerGroup">
                        <label for="bgColor">여백 색상</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                </div>
            </div>
        </div>

        <!-- 작업 목록 & 일괄 다운로드 헤더 -->
        <div class="controls-header">
            <div class="controls-title">변환 목록</div>
            <!-- 11. 일괄 다운로드 버튼 (ZIP) -->
            <button class="btn-download-all" id="downloadAllBtn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                일괄 다운로드 (ZIP)
            </button>
        </div>

        <!-- 8, 9, 10. 파일 목록 영역 -->
        <div class="file-list" id="fileList">
            <div class="empty-state" id="emptyState">업로드된 사진이 없습니다. 상단에서 사진을 추가해 주세요.</div>
        </div>
    </main>

    <script>
        // 변수 정의
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileList');
        const emptyState = document.getElementById('emptyState');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        const customRatioContainer = document.getElementById('customRatioContainer');
        const modeRadios = document.querySelectorAll('input[name="resizeMode"]');
        const colorPickerGroup = document.getElementById('colorPickerGroup');

        let fileDataList = []; // 업로드된 파일 정보 저장 array

        // 4. 비율 선택 이벤트
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                ratioBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                if (btn.dataset.ratio === 'custom') {
                    customRatioContainer.classList.add('active');
                } else {
                    customRatioContainer.classList.remove('active');
                }
                reprocessAllImages();
            });
        });

        document.getElementById('customW').addEventListener('input', reprocessAllImages);
        document.getElementById('customH').addEventListener('input', reprocessAllImages);
        document.getElementById('bgColor').addEventListener('input', reprocessAllImages);

        // 5. Mode 변경 이벤트 (Padding / Crop)
        modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'padding') {
                    colorPickerGroup.classList.remove('disabled');
                } else {
                    colorPickerGroup.classList.add('disabled');
                }
                reprocessAllImages();
            });
        });

        // 3. 드래그 앤 드롭 이벤트 처리
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        // 파일 처리 시작
        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            
            if(imageFiles.length > 0 && emptyState) {
                emptyState.style.display = 'none';
            }

            imageFiles.forEach(file => {
                const itemData = {
                    id: Date.now() + Math.random().toString(36).substr(2, 9),
                    file: file,
                    processedBlob: null,
                    isDone: false
                };
                fileDataList.push(itemData);
                createFileItemUI(itemData);
                processImage(itemData);
            });

            fileInput.value = ''; // Reset input
        }

        // 8 & 9. UI 생성 (썸네일, 프로그레스 바)
        function createFileItemUI(itemData) {
            const itemEl = document.createElement('div');
            itemEl.className = 'file-item';
            itemEl.id = `item-${itemData.id}`;

            const objectUrl = URL.createObjectURL(itemData.file);

            itemEl.innerHTML = `
                <img class="thumbnail" src="${objectUrl}" alt="thumbnail">
                <div class="file-info">
                    <div class="file-name" title="${itemData.file.name}">${itemData.file.name}</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-${itemData.id}"></div>
                    </div>
                </div>
                <button class="btn-download" id="download-${itemData.id}" disabled>다운로드</button>
            `;

            fileListContainer.appendChild(itemEl);

            // 10. 개별 개별 다운로드 버튼 이벤트
            const downloadBtn = itemEl.querySelector(`#download-${itemData.id}`);
            downloadBtn.addEventListener('click', () => {
                if (itemData.processedBlob) {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(itemData.processedBlob);
                    link.download = `resized_${itemData.file.name}`;
                    link.click();
                }
            });
        }

        // 비율 구하기
        function getSelectedAspectRatio() {
            const activeBtn = document.querySelector('.ratio-btn.active');
            const ratioType = activeBtn.dataset.ratio;

            if (ratioType === 'custom') {
                const w = parseFloat(document.getElementById('customW').value) || 1;
                const h = parseFloat(document.getElementById('customH').value) || 1;
                return w / h;
            } else {
                const [w, h] = ratioType.split(':').map(Number);
                return w / h;
            }
        }

        // 6 & 7. 이미지 처리 엔진 (Canvas 이용)
        function processImage(itemData) {
            itemData.isDone = false;
            updateDownloadAllState();

            const progressBar = document.getElementById(`progress-${itemData.id}`);
            const downloadBtn = document.getElementById(`download-${itemData.id}`);
            
            if(downloadBtn) downloadBtn.disabled = true;
            if(progressBar) progressBar.style.width = '0%';

            const img = new Image();
            img.src = URL.createObjectURL(itemData.file);

            img.onload = () => {
                const targetRatio = getSelectedAspectRatio();
                const mode = document.querySelector('input[name="resizeMode"]:checked').value;
                const bgColor = document.getElementById('bgColor').value;

                // 캔버스 크기 계산 (원본 해상도 기준)
                let canvasWidth, canvasHeight;
                if (img.width / img.height > targetRatio) {
                    canvasWidth = img.width;
                    canvasHeight = img.width / targetRatio;
                } else {
                    canvasHeight = img.height;
                    canvasWidth = img.height * targetRatio;
                }

                const canvas = document.createElement('canvas');
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                const ctx = canvas.getContext('2d');

                // 6. Padding 처리
                if (mode === 'padding') {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                    let drawWidth, drawHeight, offsetX, offsetY;
                    const imgRatio = img.width / img.height;

                    if (imgRatio > targetRatio) {
                        drawWidth = canvasWidth;
                        drawHeight = canvasWidth / imgRatio;
                        offsetX = 0;
                        offsetY = (canvasHeight - drawHeight) / 2;
                    } else {
                        drawHeight = canvasHeight;
                        drawWidth = canvasHeight * imgRatio;
                        offsetX = (canvasWidth - drawWidth) / 2;
                        offsetY = 0;
                    }

                    ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                } 
                // 7. Crop 처리
                else if (mode === 'crop') {
                    let sourceX = 0, sourceY = 0, sourceWidth = img.width, sourceHeight = img.height;
                    const imgRatio = img.width / img.height;

                    if (imgRatio > targetRatio) {
                        sourceWidth = img.height * targetRatio;
                        sourceX = (img.width - sourceWidth) / 2;
                    } else {
                        sourceHeight = img.width / targetRatio;
                        sourceY = (img.height - sourceHeight) / 2;
                    }

                    ctx.drawImage(img, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvasWidth, canvasHeight);
                }

                // 9. 프로그레스 바 애니메이션 시뮬레이션
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 20;
                    if (progressBar) progressBar.style.width = `${progress}%`;

                    if (progress >= 100) {
                        clearInterval(interval);
                        
                        // 캔버스를 Blob으로 변환
                        canvas.toBlob((blob) => {
                            itemData.processedBlob = blob;
                            itemData.isDone = true;
                            
                            // 10. 프로그레스 바 100% 도착 시 버튼 활성화
                            if(downloadBtn) downloadBtn.disabled = false;
                            updateDownloadAllState();
                        }, itemData.file.type || 'image/jpeg');
                    }
                }, 40);
            };
        }

        // 옵션이 바뀔 때 기존 이미지를 다시 처리
        function reprocessAllImages() {
            fileDataList.forEach(itemData => {
                processImage(itemData);
            });
        }

        // 11. 모든 사진 작업 완료 확인 및 일괄 다운로드 버튼 상태 업데이트
        function updateDownloadAllState() {
            const allCompleted = fileDataList.length > 0 && fileDataList.every(item => item.isDone);
            downloadAllBtn.disabled = !allCompleted;
        }

        // 11. 일괄 압축(ZIP) 다운로드
        downloadAllBtn.addEventListener('click', () => {
            if (!downloadAllBtn.disabled) {
                const zip = new JSZip();
                
                fileDataList.forEach((item) => {
                    const extension = item.file.name.split('.').pop();
                    const nameWithoutExt = item.file.name.substring(0, item.file.name.lastIndexOf('.'));
                    const filename = `resized_${nameWithoutExt}.${extension}`;
                    
                    zip.file(filename, item.processedBlob);
                });

                zip.generateAsync({ type: 'blob' }).then((content) => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = 'resized_images.zip';
                    link.click();
                });
            }
        });
    </script>
</body>
</html>
