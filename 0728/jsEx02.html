<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
alert("환영합니다!");

const name = prompt("이름을 입력하세요.");

const ok = confirm(name + "님, 계속 진행하시겠습니까?");

if (ok) {
    alert("진행합니다.");
} else {
    alert("취소되었습니다.");
}
</script>
</body>
</html>
